spring.application.name=x-post-hitl

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/xposthitl
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# Spring AI - Google Gemini configuration
# Supply your API key via environment variable GOOGLE_AI_API_KEY
spring.ai.google.ai.gemini.api-key=${GOOGLE_AI_API_KEY:}
# Default model; user requested Gemini 3.0 flash (assumed current/latest)
spring.ai.google.ai.gemini.chat.options.model=${GEMINI_MODEL:gemini-3.0-flash}

# Telegram Bot Configuration
telegram.bot.name=${TELEGRAM_BOT_NAME:x_post_hitl_bot}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.chat-id=${TELEGRAM_CHAT_ID:}
