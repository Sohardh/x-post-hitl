services:
  db:
    image: postgres:15-alpine
    container_name: x-post-hitl-db
    environment:
      POSTGRES_DB: xposthitl
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Calcutta
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d xposthitl" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: x-post-hitl-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/xposthitl
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY}
      TELEGRAM_BOT_NAME: ${TELEGRAM_BOT_NAME}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.0-flash}
      TZ: Asia/Calcutta
    ports:
      - "8080:8080"
    restart: always
